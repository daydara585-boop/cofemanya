<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Вход в Cofeманию</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      ☕ Cofeмания
    </div>
  </header>

  <main class="hero">
    <div class="overlay">

      <h1>Добро пожаловать в кофейню</h1>

      <p class="subtitle">
        Здесь начинается твоя маленькая история.
      </p>

      <p class="text">
        Введи пригласительный код, чтобы войти.
      </p>

      <form id="invite-form">

        <input
          type="text"
          id="invite-code"
          placeholder="Пригласительный код"
          required
        >
        <input
  type="text"
  id="display-name"
  placeholder="Твоё имя"
  required
>

<input
  type="email"
  id="email"
  placeholder="Email"
  required
>

<input
  type="password"
  id="password"
  placeholder="Пароль"
  required
>

        <button type="submit" class="coffee-button">
          Продолжить
        </button>

      </form>

      <p id="message"></p>
      <hr>

<h2>Уже есть аккаунт? ☕</h2>

<form id="login-form">
  <div id="reset-password-box" style="display: none;">

  <h2>Придумай новый пароль 🔐</h2>

  <input
    type="password"
    id="new-password"
    placeholder="Новый пароль"
    minlength="6"
  >

  <input
    type="password"
    id="new-password-confirm"
    placeholder="Повтори новый пароль"
    minlength="6"
  >

  <button
    type="button"
    id="save-new-password"
    class="coffee-button"
  >
    Сохранить новый пароль
  </button>

  <p id="reset-message"></p>

</div>

  <input
    type="email"
    id="login-email"
    placeholder="Email"
  >

  <input
    type="password"
    id="login-password"
    placeholder="Пароль"
  >
<button
  type="button"
  id="forgot-password"
  class="secret-link"
>
  Забыли пароль?
</button>

  <button type="submit" class="coffee-button">
    Войти
  </button>

</form>

<p id="login-message"></p>

    </div>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <script>
  const SUPABASE_URL = 'https://qjokxrjavmxfwtsrvmzh.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QuiV_fH8xLvdOcjJCeB3nQ_B5dK7zjm';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
  
  const resetBox = document.getElementById('reset-password-box');
const newPassword = document.getElementById('new-password');
const newPasswordConfirm =
  document.getElementById('new-password-confirm');
const saveNewPassword =
  document.getElementById('save-new-password');
const resetMessage =
  document.getElementById('reset-message');

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    resetBox.style.display = 'block';
  }
});

saveNewPassword.addEventListener('click', async () => {
  const password = newPassword.value;
  const confirm = newPasswordConfirm.value;

  if (password.length < 6) {
    resetMessage.textContent =
      'Пароль должен содержать минимум 6 символов.';
    return;
  }

  if (password !== confirm) {
    resetMessage.textContent =
      'Пароли не совпадают.';
    return;
  }

  resetMessage.textContent =
    'Сохраняем новый пароль...';

  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });

  if (error) {
    console.error('Ошибка смены пароля:', error);
    resetMessage.textContent =
      error.message;
    return;
  }

  resetMessage.textContent =
    'Пароль успешно изменён! ❤️';

  setTimeout(() => {
    resetBox.style.display = 'none';
  }, 1500);
});

  // ===== РЕГИСТРАЦИЯ =====

  const form = document.getElementById('invite-form');
  const message = document.getElementById('message');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const code = document.getElementById('invite-code').value.trim();
    const displayName = document.getElementById('display-name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    message.textContent = 'Проверяем приглашение...';

    const { data: inviteValid, error: inviteError } =
      await supabaseClient.rpc('check_invite_code', {
        invite_code: code
      });

    if (inviteError) {
      console.error('Ошибка проверки приглашения:', inviteError);
      message.textContent = 'Не удалось проверить приглашение.';
      return;
    }

    if (!inviteValid) {
      message.textContent = 'Такого свободного приглашения нет.';
      return;
    }

    message.textContent =
      'Приглашение действительно. Создаём аккаунт...';

    const { data: authData, error: authError } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (authError) {
      console.error('Ошибка регистрации:', authError);
      message.textContent = authError.message;
      return;
    }

    const user = authData.user;

    if (!user) {
      message.textContent = 'Не удалось создать аккаунт.';
      return;
    }
   
   const { data: setupResult, error: setupError } =
  await supabaseClient.rpc('finish_member_setup', {
    member_user_id: user.id,
    member_name: displayName,
    member_invite_code: code
  });

if (setupError) {
  console.error('Ошибка сохранения профиля:', setupError);
  message.textContent = 'Аккаунт создан, но не удалось сохранить профиль.';
  return;
}

if (!setupResult) {
  console.error('Профиль не был обновлён.');
  message.textContent = 'Не удалось сохранить данные участника.';
  return;
}

message.textContent =
  'Добро пожаловать в Cofeманию! ❤️';

    setTimeout(() => {
      window.location.href = 'coffee.html';
    }, 1000);
  });


  // ===== ВХОД =====

  const loginForm = document.getElementById('login-form');
  const loginMessage = document.getElementById('login-message');
  const forgotPassword =
  document.getElementById('forgot-password');

forgotPassword.addEventListener('click', async () => {
  const loginEmail =
    document.getElementById('login-email').value.trim();

  if (!loginEmail) {
    loginMessage.textContent =
      'Сначала введи свой email.';
    return;
  }

  loginMessage.textContent =
    'Отправляем письмо для восстановления...';

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      loginEmail,
      {
        redirectTo:
          window.location.origin + '/register.html'
      }
    );

  if (error) {
    console.error(
      'Ошибка восстановления пароля:',
      error
    );

    loginMessage.textContent =
      'Не удалось отправить письмо: ' +
      error.message;

    return;
  }

  loginMessage.textContent =
    'Письмо для восстановления отправлено! Проверь почту ❤️';
});

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    const loginEmail =
      document.getElementById('login-email').value.trim();

    const loginPassword =
      document.getElementById('login-password').value;

    loginMessage.textContent = 'Входим...';

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: loginEmail,
        password: loginPassword
      });

    if (error) {
      console.error('Ошибка входа:', error);
      loginMessage.textContent = error.message;
      return;
    }

    loginMessage.textContent =
      'Добро пожаловать обратно! ❤️';

    setTimeout(() => {
      window.location.href = 'coffee.html';
    }, 1000);
  });
</script>

</body>
</html>
